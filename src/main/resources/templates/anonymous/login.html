<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Login - PhotoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color:#F7F3F5;">PhotoStore</a>
    </div>
</nav>

<div class="container" style="max-width: 480px;">
    <h1 class="mb-4">Login</h1>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password.
    </div>
    <div th:if="${param.registered}" class="alert alert-success">
        Registration successful! Please log in.
    </div>

    <div class="card p-4">
        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <p class="mt-3 text-center">
        Don't have an account? <a href="/register" style="color:var(--ps-mid);">Register here</a>
    </p>
</div>
</body>
</html>
