<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title th:text="${picture.title} + ' - PhotoStore'">Picture Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" style="color:#F7F3F5;">PhotoStore</a>
        <div class="d-flex gap-2 align-items-center">
            <a th:href="@{/categories}" class="ps-nav-btn">Categories</a>
            <a th:href="@{/pictures}" class="ps-nav-btn">Pictures</a>
            <a href="/cart" class="ps-nav-btn">
                Cart
                <span th:if="${cartItemCount > 0}"
                      th:text="${cartItemCount}"
                      style="background:#c0392b;color:white;border-radius:50%;
                 padding:1px 6px;font-size:0.75rem;margin-left:3px;">
    </span>
            </a>
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="ps-nav-btn">Login</a>
                <a th:href="@{/register}" class="ps-nav-btn">Register</a>
            </span>
            <span sec:authorize="isAuthenticated()">
                <form method="post" th:action="@{/logout}" class="d-inline">
                    <button type="submit" class="ps-nav-btn ps-nav-btn--logout">Logout</button>
                </form>
            </span>
        </div>
    </div>
</nav>

<div class="container">
    <a th:href="@{/pictures}" class="btn btn-secondary mb-4">&larr; Back to Pictures</a>

    <div class="row">
        <div class="col-md-6">
            <img th:src="${picture.imageUrl}"
                 th:alt="${picture.title}"
                 class="img-fluid rounded"
                 style="box-shadow: 0 4px 16px rgba(64,50,52,0.15);">
        </div>
        <div class="col-md-6">
            <h1 th:text="${picture.title}">Title</h1>
            <p class="text-muted" th:text="'Category: ' + ${picture.categoryName}">Category</p>
            <p th:text="${picture.description}">Description</p>
            <p class="fs-3 fw-bold" style="color:var(--ps-dark);"
               th:text="'€' + ${#numbers.formatDecimal(picture.price, 1, 2)}">Price</p>
            <p class="text-muted" th:text="'In stock: ' + ${picture.stockQuantity}">Stock</p>

            <form method="post" th:action="@{/cart/add}" class="mt-3">
                <input type="hidden" name="pictureId" th:value="${picture.id}">
                <div class="input-group" style="max-width: 220px;">
                    <input type="number" name="quantity" value="1" min="1"
                           th:max="${picture.stockQuantity}"
                           class="form-control">
                    <button type="submit" class="btn btn-primary">Add to Cart</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
