<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Register - PhotoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color:#F7F3F5;">PhotoStore</a>
    </div>
</nav>

<div class="container" style="max-width: 520px;">
    <h1 class="mb-4">Register</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <div class="card p-4">
        <form method="post" th:action="@{/register}" th:object="${form}">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control">
                <div th:if="${#fields.hasErrors('email')}" class="text-danger"
                     th:errors="*{email}">Error</div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control">
                <div th:if="${#fields.hasErrors('password')}" class="text-danger"
                     th:errors="*{password}">Error</div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label fw-semibold">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control">
                    <div th:if="${#fields.hasErrors('firstName')}" class="text-danger"
                         th:errors="*{firstName}">Error</div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label fw-semibold">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control">
                    <div th:if="${#fields.hasErrors('lastName')}" class="text-danger"
                         th:errors="*{lastName}">Error</div>
                </div>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label fw-semibold">Address</label>
                <input type="text" id="address" th:field="*{address}" class="form-control">
                <div th:if="${#fields.hasErrors('address')}" class="text-danger"
                     th:errors="*{address}">Error</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
    </div>

    <p class="mt-3 text-center">
        Already have an account? <a href="/login" style="color:var(--ps-mid);">Login here</a>
    </p>
</div>
</body>
</html>
