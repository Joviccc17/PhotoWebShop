<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Cart - PhotoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color:#F7F3F5;">PhotoStore</a>
        <div class="d-flex gap-2 align-items-center">
            <a href="/categories" class="ps-nav-btn">Categories</a>
            <a href="/pictures" class="ps-nav-btn">Pictures</a>
            <a href="/cart" class="ps-nav-btn">
                Cart
                <span th:if="${cartItemCount > 0}"
                      th:text="${cartItemCount}"
                      style="background:#c0392b;color:white;border-radius:50%;
                 padding:1px 6px;font-size:0.75rem;margin-left:3px;">
    </span>
            </a>
            <span sec:authorize="!isAuthenticated()">
                <a href="/login" class="ps-nav-btn">Login</a>
                <a href="/register" class="ps-nav-btn">Register</a>
            </span>
            <span sec:authorize="isAuthenticated()">
                <form method="post" th:action="@{/logout}" class="d-inline">
                    <button type="submit" class="ps-nav-btn ps-nav-btn--logout">Logout</button>
                </form>
            </span>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Shopping Cart</h1>

    <div th:if="${cart.isEmpty()}" class="alert alert-info">
        Your cart is empty. <a href="/pictures" style="color:var(--ps-mid);">Browse pictures</a>
    </div>

    <div th:unless="${cart.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>Picture</th>
                <th>Title</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.items}">
                <td>
                    <img th:src="${item.imageUrl}" th:alt="${item.title}"
                         style="height: 60px; width: 80px; object-fit: cover; border-radius: 4px;">
                </td>
                <td th:text="${item.title}">Title</td>
                <td th:text="'€' + ${#numbers.formatDecimal(item.price, 1, 2)}">Price</td>
                <td>
                    <input type="number"
                           class="form-control form-control-sm qty-input"
                           th:value="${item.quantity}"
                           th:data-picture-id="${item.pictureId}"
                           th:data-price="${item.price}"
                           min="1"
                           style="max-width: 80px;">
                </td>
                <td class="subtotal-cell"
                    th:data-price="${item.price}"
                    th:text="'€' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">Subtotal</td>
                <td>
                    <form method="post" action="/cart/remove">
                        <input type="hidden" name="pictureId" th:value="${item.pictureId}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <form method="post" action="/cart/clear">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger">Clear Cart</button>
            </form>
            <div class="text-end">
                <h4 id="cart-total">Total: €<span th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">0.00</span></h4>
                <a href="/user/checkout" class="btn btn-success btn-lg mt-2">Proceed to Checkout</a>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
    const csrfParam = /*[[${_csrf.parameterName}]]*/ '_csrf';
    const csrfToken = /*[[${_csrf.token}]]*/ '';

    function recalcTotal() {
        let total = 0;
        document.querySelectorAll('.qty-input').forEach(input => {
            const price = parseFloat(input.dataset.price);
            const qty = parseInt(input.value) || 1;
            total += price * qty;
        });
        document.querySelector('#cart-total span').textContent = total.toFixed(2);
    }

    document.querySelectorAll('.qty-input').forEach(input => {
        const row = input.closest('tr');
        const subtotalCell = row.querySelector('.subtotal-cell');

        input.addEventListener('change', () => {
            const qty = Math.max(1, parseInt(input.value) || 1);
            input.value = qty;

            const price = parseFloat(input.dataset.price);
            subtotalCell.textContent = '€' + (price * qty).toFixed(2);
            recalcTotal();

            const body = new URLSearchParams();
            body.append('pictureId', input.dataset.pictureId);
            body.append('quantity', qty);
            body.append(csrfParam, csrfToken);
            fetch('/cart/update', { method: 'POST', body });
        });
    });
</script>
</body>
</html>
