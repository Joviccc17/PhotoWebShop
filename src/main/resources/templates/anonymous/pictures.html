<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Pictures - PhotoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color:#F7F3F5;">PhotoStore</a>
        <div class="d-flex gap-2 align-items-center">
            <a href="/categories" class="ps-nav-btn">Categories</a>
            <a href="/cart" class="ps-nav-btn">Cart</a>
            <span sec:authorize="!isAuthenticated()">
                <a href="/login" class="ps-nav-btn">Login</a>
                <a href="/register" class="ps-nav-btn">Register</a>
            </span>
            <span sec:authorize="isAuthenticated()">
                <form method="post" th:action="@{/logout}" class="d-inline">
                    <button type="submit" class="ps-nav-btn ps-nav-btn--logout">Logout</button>
                </form>
            </span>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-3">
        <span th:if="${selectedCategory != null}"
              th:text="${selectedCategory.name} + ' Pictures'">Category Pictures</span>
        <span th:if="${selectedCategory == null}">All Pictures</span>
    </h1>

    <div class="mb-4 d-flex flex-wrap gap-1">
        <a href="/pictures" class="btn btn-outline-secondary btn-sm"
           th:classappend="${selectedCategory == null} ? ' active'">All</a>
        <a th:each="cat : ${categories}"
           th:href="@{/pictures(categoryId=${cat.id})}"
           th:text="${cat.name}"
           th:classappend="${selectedCategory != null && selectedCategory.id == cat.id} ? ' active'"
           class="btn btn-outline-secondary btn-sm">Category</a>
    </div>

    <div th:if="${#lists.isEmpty(pictures)}" class="alert alert-info">
        No pictures found.
    </div>

    <div id="picture-grid" class="row">
        <div class="col-md-4 mb-3" th:each="picture : ${pictures}">
            <div class="card h-100">
                <img th:src="${picture.imageUrl}" th:alt="${picture.title}"
                     class="card-img-top" style="height:240px;object-fit:cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${picture.title}">Title</h5>
                    <p class="card-text text-muted small" th:text="${picture.description}">Description</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fs-5 fw-bold"
                              th:text="'€' + ${#numbers.formatDecimal(picture.price, 1, 2)}">Price</span>
                        <a th:href="@{/pictures/{id}(id=${picture.id})}"
                           class="btn btn-primary btn-sm">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${totalPages > 1}" class="mt-4" aria-label="Picture pagination">
        <ul id="pagination" class="pagination justify-content-center">
            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:id="'page-item-' + ${i}"
                th:classappend="${i == currentPage} ? 'active'"
                class="page-item">
                <span th:if="${i == currentPage}" class="page-link" th:text="${i + 1}">1</span>
                <button th:if="${i != currentPage}" class="page-link"
                        th:text="${i + 1}" th:attr="data-page=${i}"
                        onclick="loadPage(this)">1</button>
            </li>
        </ul>
    </nav>
</div>

<script th:inline="javascript">
    const categoryId = null;

    function loadPage(btn) {
        const page = parseInt(btn.getAttribute('data-page'));
        const url = '/api/pictures/paged?page=' + page + '&size=6' +
            (categoryId != null ? '&categoryId=' + categoryId : '');

        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                const grid = document.getElementById('picture-grid');
                if (data.pictures.length === 0) {
                    grid.innerHTML = '<div class="col"><div class="alert alert-info">No pictures found.</div></div>';
                } else {
                    grid.innerHTML = data.pictures.map(function(p) {
                        return '<div class="col-md-4 mb-3">' +
                            '<div class="card h-100">' +
                            '<img src="' + p.imageUrl + '" alt="' + p.title + '" ' +
                            'class="card-img-top" style="height:240px;object-fit:cover;">' +
                            '<div class="card-body d-flex flex-column">' +
                            '<h5 class="card-title">' + p.title + '</h5>' +
                            '<p class="card-text text-muted small">' + p.description + '</p>' +
                            '<div class="mt-auto d-flex justify-content-between align-items-center">' +
                            '<span class="fs-5 fw-bold">€' + Number(p.price).toFixed(2) + '</span>' +
                            '<a href="/pictures/' + p.id + '" class="btn btn-primary btn-sm">View Details</a>' +
                            '</div></div></div></div>';
                    }).join('');
                }

                document.querySelectorAll('#pagination .page-item').forEach(function(li, i) {
                    const active = i === page;
                    li.classList.toggle('active', active);
                    const inner = active
                        ? '<span class="page-link">' + (i + 1) + '</span>'
                        : '<button class="page-link" data-page="' + i + '" onclick="loadPage(this)">' + (i + 1) + '</button>';
                    li.innerHTML = inner;
                });

                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
