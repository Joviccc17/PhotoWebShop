<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin Dashboard - PhotoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1>Dashboard</h1>
        </div>

        <div class="ps-admin-content">
            <p class="text-muted mb-4">Welcome back, Admin.</p>

            <div class="row g-4">
                <div class="col-sm-6 col-xl-3">
                    <a th:href="@{/admin/categories}" class="ps-stat-card">
                        <div class="ps-stat-icon">&#9783;</div>
                        <div class="ps-stat-value" th:text="${categoryCount}">0</div>
                        <div class="ps-stat-label">Categories</div>
                    </a>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <a th:href="@{/admin/pictures}" class="ps-stat-card">
                        <div class="ps-stat-icon">&#9998;</div>
                        <div class="ps-stat-value" th:text="${pictureCount}">0</div>
                        <div class="ps-stat-label">Pictures</div>
                    </a>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <a th:href="@{/admin/orders}" class="ps-stat-card">
                        <div class="ps-stat-icon">&#9783;</div>
                        <div class="ps-stat-value" th:text="${orderCount}">0</div>
                        <div class="ps-stat-label">Orders</div>
                    </a>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <a th:href="@{/admin/login-history}" class="ps-stat-card">
                        <div class="ps-stat-icon">&#9776;</div>
                        <div class="ps-stat-value" th:text="${loginCount}">0</div>
                        <div class="ps-stat-label">Login Records</div>
                    </a>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
