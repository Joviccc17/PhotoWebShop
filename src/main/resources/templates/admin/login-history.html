<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin - Login History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1>Login History</h1>
        </div>

        <div class="ps-admin-content">
            <div th:if="${#lists.isEmpty(logins)}" class="alert alert-info">
                No login records yet.
            </div>

            <table th:unless="${#lists.isEmpty(logins)}" class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Login Time</th>
                    <th>IP Address</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="login : ${logins}">
                    <td th:text="${login.userFirstName + ' ' + login.userLastName}">Name</td>
                    <td th:text="${login.userEmail}">Email</td>
                    <td th:text="${#temporals.format(login.loginTime, 'dd.MM.yyyy HH:mm:ss')}">Time</td>
                    <td th:text="${login.ipAddress}">IP</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
