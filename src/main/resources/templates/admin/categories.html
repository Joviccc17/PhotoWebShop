<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin - Categories</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1>Categories</h1>
            <a th:href="@{/admin/categories/new}" class="btn btn-primary btn-sm">+ Add Category</a>
        </div>

        <div class="ps-admin-content">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

            <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info">
                No categories yet.
            </div>

            <table th:unless="${#lists.isEmpty(categories)}" class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">1</td>
                    <td th:text="${category.name}">Name</td>
                    <td th:text="${category.description}">Description</td>
                    <td>
                        <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                           class="btn btn-sm btn-secondary me-1">Edit</a>
                        <form method="post"
                              th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
                              class="d-inline"
                              onsubmit="return confirm('Are you sure?')">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
