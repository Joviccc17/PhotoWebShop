<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin - Category Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1 th:text="${categoryId != null} ? 'Edit Category' : 'New Category'">Category Form</h1>
            <a th:href="@{/admin/categories}" class="btn btn-secondary btn-sm">&#8592; Back</a>
        </div>

        <div class="ps-admin-content">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

            <div class="card p-4" style="max-width: 560px;">
                <form method="post" th:action="@{${actionUrl}}" th:object="${form}">

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control">
                        <div th:if="${#fields.hasErrors('name')}" class="text-danger"
                             th:errors="*{name}">Error</div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea id="description" th:field="*{description}"
                                  class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/admin/categories}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
