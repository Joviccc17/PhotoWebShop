<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin - Order Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1>Order #<span th:text="${order.id}">1</span></h1>
            <a th:href="@{/admin/orders}" class="btn btn-secondary btn-sm">&#8592; Back to Orders</a>
        </div>

        <div class="ps-admin-content">
            <div class="card p-4 mb-4">
                <div class="row">
                    <div class="col-md-6">
                        <p><span class="fw-semibold">Customer:</span>
                            <span th:text="${order.userEmail}">Email</span></p>
                        <p><span class="fw-semibold">Name:</span>
                            <span th:text="${order.userFirstName + ' ' + order.userLastName}">Name</span></p>
                        <p><span class="fw-semibold">Address:</span>
                            <span th:text="${order.userAddress}">Address</span></p>
                    </div>
                    <div class="col-md-6">
                        <p><span class="fw-semibold">Placed on:</span>
                            <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">Date</span></p>
                        <p><span class="fw-semibold">Payment:</span>
                            <span th:text="${order.paymentMethod}">Method</span></p>
                        <p><span class="fw-semibold">Status:</span>
                            <span class="badge ms-1"
                                  th:classappend="${order.status == 'COMPLETED'} ? 'bg-success' :
                                                  (${order.status == 'PENDING'} ? 'bg-warning' :
                                                  (${order.status == 'PAID'} ? 'bg-info' : 'bg-danger'))"
                                  th:text="${order.status}">Status</span>
                        </p>
                    </div>
                </div>
            </div>

            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Picture</th>
                    <th>Title</th>
                    <th>Price at Purchase</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td>
                        <img th:src="${item.pictureImageUrl}" th:alt="${item.pictureTitle}"
                             style="height: 50px; width: 70px; object-fit: cover; border-radius: 4px;">
                    </td>
                    <td th:text="${item.pictureTitle}">Title</td>
                    <td th:text="'€' + ${#numbers.formatDecimal(item.priceAtPurchase, 1, 2)}">Price</td>
                    <td th:text="${item.quantity}">Qty</td>
                    <td th:text="'€' + ${#numbers.formatDecimal(item.priceAtPurchase * item.quantity, 1, 2)}">Subtotal</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
