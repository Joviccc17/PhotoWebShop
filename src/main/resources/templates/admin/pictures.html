<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin - Pictures</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1>Pictures</h1>
            <a th:href="@{/admin/pictures/new}" class="btn btn-primary btn-sm">+ Add Picture</a>
        </div>

        <div class="ps-admin-content">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

            <div th:if="${#lists.isEmpty(pictures)}" class="alert alert-info">
                No pictures yet.
            </div>

            <table th:unless="${#lists.isEmpty(pictures)}" class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="picture : ${pictures}">
                    <td>
                        <img th:src="${picture.imageUrl}" th:alt="${picture.title}"
                             style="height: 50px; width: 70px; object-fit: cover; border-radius: 4px;">
                    </td>
                    <td th:text="${picture.title}">Title</td>
                    <td th:text="${picture.categoryName}">Category</td>
                    <td th:text="'€' + ${#numbers.formatDecimal(picture.price, 1, 2)}">Price</td>
                    <td th:text="${picture.stockQuantity}">Stock</td>
                    <td>
                        <a th:href="@{/admin/pictures/edit/{id}(id=${picture.id})}"
                           class="btn btn-sm btn-secondary me-1">Edit</a>
                        <form method="post"
                              th:action="@{/admin/pictures/delete/{id}(id=${picture.id})}"
                              class="d-inline"
                              onsubmit="return confirm('Are you sure?')">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
