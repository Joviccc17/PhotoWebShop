<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Admin - Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<div class="ps-admin-wrap">

    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <main class="ps-admin-main">
        <div class="ps-admin-topbar">
            <h1>Orders</h1>
        </div>

        <div class="ps-admin-content">
            <form method="get" th:action="@{/admin/orders}" th:object="${searchForm}"
                  class="card p-3 mb-4" style="border-color: var(--ps-accent);">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="email" class="form-label fw-semibold">Customer Email</label>
                        <input type="text" id="email" th:field="*{email}"
                               class="form-control" placeholder="Search by email...">
                    </div>
                    <div class="col-md-3">
                        <label for="dateFrom" class="form-label fw-semibold">From Date</label>
                        <input type="date" id="dateFrom" th:field="*{dateFrom}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="dateTo" class="form-label fw-semibold">To Date</label>
                        <input type="date" id="dateTo" th:field="*{dateTo}" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Filter</button>
                    </div>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
                No orders found.
            </div>

            <table th:unless="${#lists.isEmpty(orders)}" class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Order #</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Items</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">1</td>
                    <td th:text="${order.userEmail}">Email</td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">Date</td>
                    <td th:text="${order.paymentMethod}">Payment</td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status == 'COMPLETED'} ? 'bg-success' :
                                              (${order.status == 'PENDING'} ? 'bg-warning' :
                                              (${order.status == 'PAID'} ? 'bg-info' : 'bg-danger'))"
                              th:text="${order.status}">Status</span>
                    </td>
                    <td th:text="${order.items.size()} + ' item(s)'">Items</td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                           class="btn btn-sm btn-primary">Details</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
