<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>My Orders - PhotoStore</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" style="color:#F7F3F5;">PhotoStore</a>
        <div class="d-flex gap-2 align-items-center">
            <a th:href="@{/pictures}" class="ps-nav-btn">Pictures</a>
            <a th:href="@{/cart}" class="ps-nav-btn">Cart</a>
            <a th:href="@{/user/orders}" class="ps-nav-btn">My Orders</a>
            <form method="post" th:action="@{/logout}" class="d-inline">
                <button type="submit" class="ps-nav-btn ps-nav-btn--logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">My Orders</h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}">Success</div>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        You have no orders yet. <a th:href="@{/pictures}">Browse pictures</a>
    </div>

    <table th:unless="${#lists.isEmpty(orders)}" class="table table-striped">
        <thead>
        <tr>
            <th>Order #</th>
            <th>Date</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Items</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">Date</td>
            <td th:text="${order.paymentMethod}">Payment</td>
            <td>
                    <span class="badge"
                          th:classappend="${order.status == 'COMPLETED'} ? 'bg-success' :
                                          (${order.status == 'PENDING'} ? 'bg-warning' :
                                          (${order.status == 'PAID'} ? 'bg-info' : 'bg-danger'))"
                          th:text="${order.status}">Status</span>
            </td>
            <td th:text="${order.items.size()} + ' item(s)'">Items</td>
            <td>
                <a th:href="@{/user/orders/{id}(id=${order.id})}"
                   class="btn btn-sm btn-primary">Details</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
