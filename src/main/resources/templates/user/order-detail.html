<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Order Detail - PhotoStore</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" style="color:#F7F3F5;">PhotoStore</a>
        <div class="d-flex gap-2 align-items-center">
            <a th:href="@{/user/orders}" class="ps-nav-btn">Back to Orders</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-2">Order #<span th:text="${order.id}">1</span></h1>
    <p class="text-muted"
       th:text="'Placed on ' + ${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">Date</p>
    <p>Payment: <strong th:text="${order.paymentMethod}">Method</strong></p>
    <p>Status:
        <span class="badge"
              th:classappend="${order.status == 'COMPLETED'} ? 'bg-success' :
                              (${order.status == 'PENDING'} ? 'bg-warning' :
                              (${order.status == 'PAID'} ? 'bg-info' : 'bg-danger'))"
              th:text="${order.status}">Status</span>
    </p>

    <table class="table mt-4">
        <thead>
        <tr>
            <th>Picture</th>
            <th>Title</th>
            <th>Price at Purchase</th>
            <th>Quantity</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td>
                <img th:src="${item.pictureImageUrl}" th:alt="${item.pictureTitle}"
                     style="height: 50px; object-fit: cover;">
            </td>
            <td th:text="${item.pictureTitle}">Title</td>
            <td th:text="'€' + ${#numbers.formatDecimal(item.priceAtPurchase, 1, 2)}">Price</td>
            <td th:text="${item.quantity}">Qty</td>
            <td th:text="'€' + ${#numbers.formatDecimal(item.priceAtPurchase * item.quantity, 1, 2)}">Subtotal</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/user/orders}" class="btn btn-secondary">Back to Orders</a>
</div>
</body>
</html>
