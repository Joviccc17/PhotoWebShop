<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Checkout - PhotoStore</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/photostore.css}">
</head>
<body>
<nav class="navbar ps-navbar mb-4" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" style="color:#F7F3F5;">PhotoStore</a>
        <div class="d-flex gap-2 align-items-center">
            <a th:href="@{/pictures}" class="ps-nav-btn">Pictures</a>
            <a href="/cart" class="ps-nav-btn">
                Cart
                <span th:if="${cartItemCount > 0}"
                      th:text="${cartItemCount}"
                      style="background:#c0392b;color:white;border-radius:50%;
                 padding:1px 6px;font-size:0.75rem;margin-left:3px;">
    </span>
            </a>
            <a th:href="@{/user/orders}" class="ps-nav-btn">My Orders</a>
            <form method="post" th:action="@{/logout}" class="d-inline">
                <button type="submit" class="ps-nav-btn ps-nav-btn--logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 700px;">
    <h1 class="mb-4">Checkout</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <table class="table">
        <thead>
        <tr>
            <th>Picture</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
            <td th:text="${item.title}">Title</td>
            <td th:text="'€' + ${#numbers.formatDecimal(item.price, 1, 2)}">Price</td>
            <td th:text="${item.quantity}">Qty</td>
            <td th:text="'€' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">Subtotal</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3" class="text-end fw-bold">Total:</td>
            <td class="fw-bold"
                th:text="'€' + ${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">Total</td>
        </tr>
        </tfoot>
    </table>

    <form method="post" th:action="@{/user/checkout}" class="mt-4">
        <fieldset class="mb-3">
            <legend class="form-label fw-bold">Payment Method</legend>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod"
                       value="CASH_ON_DELIVERY" id="cash" checked>
                <label class="form-check-label" for="cash">Cash on Delivery (Pouzeće)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod"
                       value="PAYPAL" id="paypal">
                <label class="form-check-label" for="paypal">PayPal</label>
            </div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-lg w-100">Place Order</button>
    </form>
</div>
</body>
</html>
