spring.application.name=PhotoStore

spring.datasource.url=jdbc:h2:mem:webshopdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.h2-console.enabled=true
spring.h2-console.path=/h2-console

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=sandbox

app.init.admin-password=${ADMIN_INIT_PASSWORD:admin123}
app.init.user-password=${USER_INIT_PASSWORD:user123}

jwt.secret=${JWT_SECRET:vEQcBGV2AyQX1D4AJVl8rmQEi1ySZsM60mJOxiEdBEfUmylSoP9ia2B8PaZAmzpS}


